<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silicon Bayou #2 — Testing</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a1210; overflow: hidden; }
      .frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
      .portrait {
        position: absolute; inset: -7%;
        background: url("../../art/gators/testing-gator-still.png") center / cover no-repeat;
        animation: breathe 7.2s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1) translate3d(0, 0, 0); }
        50% { transform: scale(1.04) translate3d(0.9%, 0.35%, 0); }
      }
      .light {
        position: absolute; inset: -25%;
        background: radial-gradient(ellipse 56% 50% at 20% 42%,
          rgba(255, 168, 70, 0.17) 0%, rgba(212, 168, 72, 0.06) 40%, transparent 70%);
        mix-blend-mode: soft-light;
        animation: light 7.2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes light {
        0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.8; }
        50% { transform: translate3d(6.5%, 3%, 0); opacity: 1; }
      }
      .mist {
        position: absolute; inset: 0;
        background:
          linear-gradient(90deg, transparent 10%, rgba(230, 220, 200, 0.065) 44%, transparent 74%),
          linear-gradient(180deg, transparent 60%, rgba(176, 190, 178, 0.085) 100%);
        mix-blend-mode: screen;
        animation: mist 7.2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes mist {
        0%, 100% { transform: translateX(0); opacity: 0.48; }
        50% { transform: translateX(-3.2%); opacity: 0.76; }
      }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .portrait, .light, .mist { animation: none; }
        canvas { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="portrait" role="img" aria-label="Testing Gator, Silicon Bayou #2"></div>
      <div class="light"></div>
      <div class="mist"></div>
      <canvas id="flies"></canvas>
    </div>
    <script>
      const c = document.getElementById("flies");
      const x = c.getContext("2d");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const flies = [
        { px: 0.10, py: 0.20, r: 1.5, ph: 0.4 },
        { px: 0.88, py: 0.16, r: 1.2, ph: 1.6 },
        { px: 0.07, py: 0.70, r: 1.1, ph: 2.3 },
        { px: 0.93, py: 0.48, r: 1.4, ph: 3.8 },
        { px: 0.18, py: 0.86, r: 1.2, ph: 5.1 },
      ];
      function resize() { c.width = innerWidth; c.height = innerHeight; }
      resize();
      addEventListener("resize", resize);
      const t0 = performance.now();
      function tick(now) {
        const t = (now - t0) / 1000;
        x.clearRect(0, 0, c.width, c.height);
        for (const f of flies) {
          const a = t * 0.26 + f.ph;
          const px = (f.px + 0.015 * Math.sin(a)) * c.width;
          const py = (f.py + 0.01 * Math.cos(a * 0.9)) * c.height;
          const pulse = 0.26 + 0.2 * Math.sin(a * 0.65);
          const g = x.createRadialGradient(px, py, 0, px, py, 8);
          g.addColorStop(0, `rgba(255,210,110,${0.5 * pulse})`);
          g.addColorStop(1, "rgba(255,190,80,0)");
          x.fillStyle = g;
          x.beginPath();
          x.arc(px, py, 8, 0, Math.PI * 2);
          x.fill();
        }
        if (!reduce) requestAnimationFrame(tick);
      }
      if (!reduce) requestAnimationFrame(tick);
    </script>
  </body>
</html>
