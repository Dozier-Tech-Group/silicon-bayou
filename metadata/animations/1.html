<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silicon Bayou #1 — Engineering</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a1210; overflow: hidden; }
      .frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
      .portrait {
        position: absolute; inset: -7%;
        background: url("../../art/gators/engineering-gator-still.png") center / cover no-repeat;
        animation: breathe 7s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1) translate3d(0, 0, 0); }
        50% { transform: scale(1.045) translate3d(-1.05%, 0.45%, 0); }
      }
      .light {
        position: absolute; inset: -25%;
        background: radial-gradient(ellipse 58% 48% at 22% 40%,
          rgba(255, 176, 82, 0.18) 0%, rgba(80, 200, 210, 0.05) 42%, transparent 70%);
        mix-blend-mode: soft-light;
        animation: light 7s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes light {
        0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.82; }
        50% { transform: translate3d(7.5%, 2.5%, 0); opacity: 1; }
      }
      .mist {
        position: absolute; inset: 0;
        background:
          linear-gradient(90deg, transparent 8%, rgba(230, 220, 200, 0.07) 42%, transparent 72%),
          linear-gradient(180deg, transparent 58%, rgba(176, 190, 178, 0.09) 100%);
        mix-blend-mode: screen;
        animation: mist 7s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes mist {
        0%, 100% { transform: translateX(0); opacity: 0.5; }
        50% { transform: translateX(3.5%); opacity: 0.78; }
      }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .portrait, .light, .mist { animation: none; }
        canvas { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="portrait" role="img" aria-label="Engineering Gator, Silicon Bayou #1"></div>
      <div class="light"></div>
      <div class="mist"></div>
      <canvas id="flies"></canvas>
    </div>
    <script>
      const c = document.getElementById("flies");
      const x = c.getContext("2d");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const flies = [
        { px: 0.12, py: 0.22, r: 1.6, ph: 0.2 },
        { px: 0.86, py: 0.18, r: 1.3, ph: 1.1 },
        { px: 0.08, py: 0.62, r: 1.1, ph: 2.0 },
        { px: 0.91, py: 0.55, r: 1.4, ph: 3.4 },
        { px: 0.78, py: 0.78, r: 1.2, ph: 4.6 },
      ];
      function resize() { c.width = innerWidth; c.height = innerHeight; }
      resize();
      addEventListener("resize", resize);
      const t0 = performance.now();
      function tick(now) {
        const t = (now - t0) / 1000;
        x.clearRect(0, 0, c.width, c.height);
        for (const f of flies) {
          const a = t * 0.28 + f.ph;
          const px = (f.px + 0.016 * Math.sin(a)) * c.width;
          const py = (f.py + 0.011 * Math.cos(a * 0.85)) * c.height;
          const pulse = 0.28 + 0.22 * Math.sin(a * 0.7);
          const g = x.createRadialGradient(px, py, 0, px, py, 9);
          g.addColorStop(0, `rgba(255,214,120,${0.55 * pulse})`);
          g.addColorStop(1, "rgba(255,196,90,0)");
          x.fillStyle = g;
          x.beginPath();
          x.arc(px, py, 9, 0, Math.PI * 2);
          x.fill();
        }
        if (!reduce) requestAnimationFrame(tick);
      }
      if (!reduce) requestAnimationFrame(tick);
    </script>
  </body>
</html>
