<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silicon Bayou #3 — Construction</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a1210; overflow: hidden; }
      .frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
      .portrait {
        position: absolute; inset: -7%;
        background: url("../../art/gators/construction-gator-still.png") center / cover no-repeat;
        animation: breathe 7.4s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1) translate3d(0, 0, 0); }
        50% { transform: scale(1.042) translate3d(-0.7%, 0.55%, 0); }
      }
      .light {
        position: absolute; inset: -25%;
        background:
          radial-gradient(ellipse 54% 48% at 18% 44%,
            rgba(255, 150, 55, 0.16) 0%, transparent 68%),
          radial-gradient(ellipse 28% 22% at 78% 48%,
            rgba(255, 196, 110, 0.08) 0%, transparent 70%);
        mix-blend-mode: soft-light;
        animation: light 7.4s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes light {
        0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.84; }
        50% { transform: translate3d(5.5%, 2%, 0); opacity: 1; }
      }
      .mist {
        position: absolute; inset: 0;
        background:
          linear-gradient(90deg, transparent 6%, rgba(230, 220, 200, 0.06) 40%, transparent 70%),
          linear-gradient(180deg, transparent 56%, rgba(176, 190, 178, 0.09) 100%);
        mix-blend-mode: screen;
        animation: mist 7.4s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes mist {
        0%, 100% { transform: translateX(0); opacity: 0.5; }
        50% { transform: translateX(3%); opacity: 0.8; }
      }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .portrait, .light, .mist { animation: none; }
        canvas { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="portrait" role="img" aria-label="Construction Gator, Silicon Bayou #3"></div>
      <div class="light"></div>
      <div class="mist"></div>
      <canvas id="flies"></canvas>
    </div>
    <script>
      const c = document.getElementById("flies");
      const x = c.getContext("2d");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const flies = [
        { px: 0.11, py: 0.24, ph: 0.1 },
        { px: 0.84, py: 0.20, ph: 1.4 },
        { px: 0.90, py: 0.42, ph: 2.6 },
        { px: 0.08, py: 0.58, ph: 3.9 },
        { px: 0.72, py: 0.82, ph: 5.2 },
      ];
      function resize() { c.width = innerWidth; c.height = innerHeight; }
      resize();
      addEventListener("resize", resize);
      const t0 = performance.now();
      function tick(now) {
        const t = (now - t0) / 1000;
        x.clearRect(0, 0, c.width, c.height);
        for (const f of flies) {
          const a = t * 0.24 + f.ph;
          const px = (f.px + 0.014 * Math.sin(a)) * c.width;
          const py = (f.py + 0.01 * Math.cos(a * 0.8)) * c.height;
          const pulse = 0.24 + 0.2 * Math.sin(a * 0.6);
          const g = x.createRadialGradient(px, py, 0, px, py, 8);
          g.addColorStop(0, `rgba(255,200,100,${0.48 * pulse})`);
          g.addColorStop(1, "rgba(255,170,70,0)");
          x.fillStyle = g;
          x.beginPath();
          x.arc(px, py, 8, 0, Math.PI * 2);
          x.fill();
        }
        if (!reduce) requestAnimationFrame(tick);
      }
      if (!reduce) requestAnimationFrame(tick);
    </script>
  </body>
</html>
