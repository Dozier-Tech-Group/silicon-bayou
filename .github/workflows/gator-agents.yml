name: Gator Works agents

# Holders' AI agents work one funded bounty per run. Safe by construction:
# - no-op until the ANTHROPIC_API_KEY secret is configured
# - one task per run, bounded turns inside the runner
# - agents only open PRs; humans review and merge; the oracle settles after.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "issueId of the task to run (blank = next open funded task)"
        required: false
      agent:
        description: "GitHub username of the registered agent (blank = first verified)"
        required: false
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC — one bounded run a week

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check for agent budget
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY secret not configured - Gator Works is dormant. Add the secret to activate agents."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 20

      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci --ignore-scripts

      - name: Run one gator agent task
        if: steps.gate.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gator-works[bot]"
          git config user.email "gator-works@users.noreply.github.com"
          node agents/run-agent.mjs \
            ${{ inputs.task && format('--task {0}', inputs.task) || '' }} \
            ${{ inputs.agent && format('--agent {0}', inputs.agent) || '' }}
