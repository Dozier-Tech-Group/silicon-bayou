name: Deploy closed alpha

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static alpha
        run: |
          mkdir -p _site/gallery _site/metadata _site/testers
          cp index.html TESTERS.md _site/
          cp -r gallery/. _site/gallery/
          cp -r metadata/. _site/metadata/
          cp testers/fixtures.json _site/testers/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
