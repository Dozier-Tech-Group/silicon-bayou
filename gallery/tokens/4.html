<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silicon Bayou #4 — Capital</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a1210; overflow: hidden; }
      .frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
      .portrait {
        position: absolute; inset: -7%;
        background: url("../../art/gators/capital-gator-still.png") center / cover no-repeat;
        animation: breathe 7.6s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1) translate3d(0, 0, 0); }
        50% { transform: scale(1.038) translate3d(0.8%, -0.3%, 0); }
      }
      .light {
        position: absolute; inset: -25%;
        background: radial-gradient(ellipse 56% 50% at 24% 38%,
          rgba(255, 186, 96, 0.17) 0%, rgba(180, 140, 80, 0.05) 44%, transparent 70%);
        mix-blend-mode: soft-light;
        animation: light 7.6s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes light {
        0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.8; }
        50% { transform: translate3d(6%, 2.8%, 0); opacity: 1; }
      }
      .mist {
        position: absolute; inset: 0;
        background:
          linear-gradient(90deg, transparent 12%, rgba(230, 220, 200, 0.06) 46%, transparent 76%),
          linear-gradient(180deg, transparent 58%, rgba(176, 190, 178, 0.08) 100%);
        mix-blend-mode: screen;
        animation: mist 7.6s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes mist {
        0%, 100% { transform: translateX(0); opacity: 0.46; }
        50% { transform: translateX(3.4%); opacity: 0.74; }
      }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .portrait, .light, .mist { animation: none; }
        canvas { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="portrait" role="img" aria-label="Capital Gator, Silicon Bayou #4"></div>
      <div class="light"></div>
      <div class="mist"></div>
      <canvas id="flies"></canvas>
    </div>
    <script>
      const c = document.getElementById("flies");
      const x = c.getContext("2d");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const flies = [
        { px: 0.13, py: 0.18, ph: 0.3 },
        { px: 0.87, py: 0.22, ph: 1.5 },
        { px: 0.06, py: 0.64, ph: 2.8 },
        { px: 0.92, py: 0.60, ph: 4.0 },
        { px: 0.80, py: 0.84, ph: 5.5 },
      ];
      function resize() { c.width = innerWidth; c.height = innerHeight; }
      resize();
      addEventListener("resize", resize);
      const t0 = performance.now();
      function tick(now) {
        const t = (now - t0) / 1000;
        x.clearRect(0, 0, c.width, c.height);
        for (const f of flies) {
          const a = t * 0.22 + f.ph;
          const px = (f.px + 0.016 * Math.sin(a)) * c.width;
          const py = (f.py + 0.011 * Math.cos(a * 0.88)) * c.height;
          const pulse = 0.25 + 0.2 * Math.sin(a * 0.62);
          const g = x.createRadialGradient(px, py, 0, px, py, 9);
          g.addColorStop(0, `rgba(255,216,130,${0.5 * pulse})`);
          g.addColorStop(1, "rgba(255,190,90,0)");
          x.fillStyle = g;
          x.beginPath();
          x.arc(px, py, 9, 0, Math.PI * 2);
          x.fill();
        }
        if (!reduce) requestAnimationFrame(tick);
      }
      if (!reduce) requestAnimationFrame(tick);
    </script>
  </body>
</html>
